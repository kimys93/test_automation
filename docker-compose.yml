version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: test-automation-server
    ports:
      - "${DB_PORT:-5432}:5432"
      - "5050:5050"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-test_automation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - .:/workspace
      # Jenkins 워크스페이스의 allure-results-permanent를 직접 마운트 (자동 동기화)
      - ${JENKINS_WORKSPACE:-~/.jenkins/workspace/test_automation}/allure-results-permanent:/workspace/allure-results-permanent
      - ./allure-results:/workspace/allure-results
      - ./allure-report:/workspace/allure-report
    working_dir: /workspace
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

