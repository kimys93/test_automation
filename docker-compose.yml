version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: test-automation-server
    ports:
      - "${DB_PORT:-5432}:5432"
      - "5050:5050"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-test_automation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - .:/workspace
      - allure_results:/workspace/allure-results
      - allure_results_permanent:/workspace/allure-results-permanent
      - allure_report:/workspace/allure-report
    working_dir: /workspace
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  allure_results:
    driver: local
  allure_results_permanent:
    driver: local
  allure_report:
    driver: local

