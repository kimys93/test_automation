upstream reportportal-ui {
    server ui:8080;
}

upstream reportportal-api {
    server api:8585;
}

upstream reportportal-uat {
    server uat:9999;
}

upstream reportportal-index {
    server index:8080;
}

server {
    listen 8080;
    server_name _;

    # UI
    location /ui {
        rewrite ^/ui(.*)$ $1 break;
        proxy_pass http://reportportal-ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://reportportal-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UAT (Authorization)
    location /uat {
        rewrite ^/uat(.*)$ $1 break;
        proxy_pass http://reportportal-uat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Index (root)
    location / {
        proxy_pass http://reportportal-index;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
